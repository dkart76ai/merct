services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - merc-net

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - merc-net


  worker-chat:
    build:
      context: .
      dockerfile: services/worker-chat/Dockerfile
    restart: unless-stopped
    tty: true
    stdin_open: true
    logging:
      driver: "json-file"
    shm_size: '2gb'
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - WORKER_ID=worker-chat
      - HEADLESS=true
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK}
      - CHAT_ACCOUNT_USER=${CHAT_ACCOUNT_USER}
      - CHAT_ACCOUNT_PWD=${CHAT_ACCOUNT_PWD}
      - CHAT_CHANNEL_URL=${CHAT_CHANNEL_URL}
      # - OTP=
    volumes:
      - ./auth:/app/auth
      - ./debug:/app/debug
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - merc-net


  worker-1:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    tty: true
    stdin_open: true
    logging:
      driver: "json-file"
    shm_size: '2gb'
    expose:
      - "301"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - WORKER_ID=worker-1
      - HEADLESS=true
      - WORKER_INSTANCESE1
      - OMP_THREAD_LIMIT=1
      - NODE_OPTIONS=--max-old-space-size=4096
      - DEBUG=true
    volumes:
      - ./assets:/app/assets
      - ./auth:/app/auth
      - ./debug:/app/debug
      - ./screenshots:/app/screenshots
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - merc-net


  worker-2:
