<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayWTB - Job Queue System</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: 'Segolas', 'Consolas', monospace;
        margin: 0;
        padding: 20px;
        background: #1e1e1e;
        color: #d4d4d4;
      }
      .header {
        text-align: center;
        margin-bottom: 20px;
      }
      .header h1 {
        color: #569cd6;
        margin: 0;
        font-size: 24px;
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
        flex-wrap: wrap;
        align-items: center;
      }
      button {
        padding: 10px 20px;
        background: #0e639c;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #1177bb;
      }
      button:disabled {
        background: #444;
        cursor: not-allowed;
      }
      button.danger {
        background: #c00;
      }
      button.danger:hover {
        background: #e00;
      }
      button.active {
        background: #2e5e2e;
      }

      input,
      select {
        padding: 10px;
        background: #2d2d2d;
        color: #d4d4d4;
        border: 1px solid #444;
        border-radius: 4px;
        font-size: 14px;
      }

      label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      input[type='checkbox'] {
        width: 18px;
        height: 18px;
      }

      .panel {
        background: #252526;
        border-radius: 8px;
        margin-bottom: 15px;
        overflow: hidden;
      }
      .panel-header {
        font-weight: bold;
        padding: 10px 15px;
        background: #2d2d2d;
        border-bottom: 1px solid #3c3c3c;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .panel-header .count {
        color: #569cd6;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }
      @media (max-width: 1200px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .list {
        max-height: 250px;
        overflow-y: auto;
      }
      .list-item {
        padding: 8px 15px;
        border-bottom: 1px solid #3c3c3c;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
      }
      .list-item:hover {
        background: #2d2d2d;
      }

      .log {
        background: #1e1e1e;
        padding: 10px;
        max-height: 200px;
        overflow-y: auto;
        font-size: 12px;
        white-space: pre-wrap;
        font-family: 'Consolas', monospace;
      }

      .stat {
        display: flex;
        gap: 20px;
      }
      .stat-item {
        text-align: center;
      }
      .stat-value {
        font-size: 24px;
        color: #569cd6;
      }
      .stat-label {
        font-size: 11px;
        color: #888;
      }

      .section-title {
        font-size: 12px;
        color: #888;
        margin-bottom: 5px;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .row-wrap {
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <div class="header"><h1>PlayWTB - Job Queue System</h1></div>

    <!-- Browser Controls -->
    <div class="panel">
      <div class="panel-header">Browser <span id="browserStatus" class="count">Stopped</span></div>
      <div class="controls" style="padding: 15px">
        <button id="btnBrowserStart">Start Browser</button>
        <button id="btnBrowserStop" disabled class="danger">Stop Browser</button>
        <label>
          <input type="checkbox" id="cbCapturing" disabled />
          <span>Capture Packets</span>
        </label>
      </div>
    </div>

    <!-- Job Queue Status -->
    <div class="panel">
      <div class="panel-header">
        Job Queue
        <button id="btnRefreshJobs" style="padding: 5px 10px; font-size: 12px">Refresh</button>
      </div>
      <div class="controls" style="padding: 15px">
        <div class="stat">
          <div class="stat-item">
            <div class="stat-value" id="statWaiting">0</div>
            <div class="stat-label">Waiting</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statActive">0</div>
            <div class="stat-label">Active</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statCompleted">0</div>
            <div class="stat-label">Completed</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statFailed">0</div>
            <div class="stat-label">Failed</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Kingdom Scanner -->
    <div class="panel">
      <div class="panel-header">Kingdom Scanner</div>
      <div class="controls" style="padding: 15px">
        <input type="text" id="kingdoms" placeholder="147,142,143" style="width: 250px" />
        <select id="priority">
          <option value="HIGH">High Priority</option>
          <option value="CRITICAL">Critical</option>
          <option value="NORMAL">Normal</option>
        </select>
        <button id="btnScanKingdom">Scan Now</button>
        <button id="btnTimerStart">Start Timer</button>
        <button id="btnTimerStop" class="danger">Stop Timer</button>
      </div>
      <div class="controls" style="padding: 0 15px 15px">
        <span class="section-title">Interval (ms):</span>
        <input type="number" id="timerInterval" value="60000" style="width: 100px" />
      </div>
    </div>

    <!-- Merc Scanner -->
    <div class="panel">
      <div class="panel-header">Merc Scanner</div>
      <div class="controls" style="padding: 15px">
        <input type="number" id="mercLevel" placeholder="Min Level" style="width: 100px" />
        <button id="btnScanMercsNow">Scan Now</button>
        <button id="btnMercTimerStart">Start Timer</button>
        <button id="btnMercTimerStop" class="danger">Stop Timer</button>
      </div>
    </div>

    <!-- Active Timers -->
    <div class="panel">
      <div class="panel-header">Active Timers</div>
      <div class="list" id="timersList">
        <div class="list-item">No active timers</div>
      </div>
    </div>

    <!-- Static ID Database -->
    <div class="panel">
      <div class="panel-header">
        Static ID Database
        <span class="count" id="staticDbCount">(0)</span>
      </div>
      <div class="list" id="staticDbList">
        <div class="list-item">Loading...</div>
      </div>
    </div>

    <!-- Log -->
    <div class="panel">
      <div class="panel-header">Log</div>
      <div class="log" id="log"></div>
    </div>

    <script>
      const API = '/api'
      let refreshInterval = null

      function log(msg) {
        const el = document.getElementById('log')
        el.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`
        el.scrollTop = el.scrollHeight
      }

      async function refreshJobsStatus() {
        try {
          const res = await fetch(API + '/jobs/status')
          const data = await res.json()
          if (data.success) {
            document.getElementById('statWaiting').textContent = data.waiting
            document.getElementById('statActive').textContent = data.active
            document.getElementById('statCompleted').textContent = data.completed
            document.getElementById('statFailed').textContent = data.failed
          }
        } catch (e) {
          log('Jobs status error: ' + e.message)
        }
      }

      async function refreshTimers() {
        try {
          const res = await fetch(API + '/timers')
          const data = await res.json()
          if (data.success) {
            const el = document.getElementById('timersList')
            if (data.timers.length === 0) {
              el.innerHTML = '<div class="list-item">No active timers</div>'
            } else {
              el.innerHTML = data.timers
                .map(
                  t => `
                <div class="list-item">
                  <span>${t.key || t.name}</span>
                  <span style="color:#569cd6">${t.intervalMs}ms</span>
                </div>
              `
                )
                .join('')
            }
          }
        } catch (e) {
          log('Timers error: ' + e.message)
        }
      }

      async function refreshStaticDb() {
        try {
          const res = await fetch(API + '/static-db')
          const data = await res.json()
          if (data.success) {
            document.getElementById('staticDbCount').textContent = '(' + data.count + ')'
            const el = document.getElementById('staticDbList')
            if (data.items.length === 0) {
              el.innerHTML = '<div class="list-item">No entries</div>'
            } else {
              el.innerHTML = data.items
                .map(
                  item => `
                <div class="list-item">
                  <span>${item.staticId}</span>
                  <span style="color:#4caf50">${item.name || 'Unknown'}</span>
                  <span style="color:#569cd6">${item.entryType || ''}</span>
                </div>
              `
                )
                .join('')
            }
          }
        } catch (e) {
          log('StaticDB error: ' + e.message)
        }
      }

      async function checkBrowserStatus() {
        try {
          const res = await fetch(API + '/browser/status')
          const data = await res.json()
          if (data.success) {
            const statusEl = document.getElementById('browserStatus')
            statusEl.textContent = data.running ? 'Running' : 'Stopped'
            statusEl.style.color = data.running ? '#4caf50' : '#888'

            document.getElementById('btnBrowserStart').disabled = data.running
            document.getElementById('btnBrowserStop').disabled = !data.running
            document.getElementById('cbCapturing').disabled = !data.running
            document.getElementById('cbCapturing').checked = data.capturing
          }
        } catch (e) {
          log('Browser status error: ' + e.message)
        }
      }

      function startAutoRefresh() {
        refreshInterval = setInterval(() => {
          checkBrowserStatus()
          refreshJobsStatus()
          refreshTimers()
        }, 2000)
      }

      function stopAutoRefresh() {
        if (refreshInterval) {
          clearInterval(refreshInterval)
          refreshInterval = null
        }
      }

      // Browser handlers
      document.getElementById('btnBrowserStart').addEventListener('click', async () => {
        log('Starting browser...')
        const res = await fetch(API + '/browser/start', { method: 'POST' })
        const data = await res.json()
        if (data.success) {
          log('Browser started!')
          startAutoRefresh()
        } else {
          log('Error: ' + data.error)
        }
      })

      document.getElementById('btnBrowserStop').addEventListener('click', async () => {
        await fetch(API + '/browser/stop', { method: 'POST' })
        log('Browser stopped')
        stopAutoRefresh()
      })

      document.getElementById('cbCapturing').addEventListener('change', async e => {
        const endpoint = e.target.checked ? '/capturing/start' : '/capturing/stop'
        await fetch(API + endpoint, { method: 'POST' })
        log(e.target.checked ? 'Capturing started' : 'Capturing stopped')
      })

      // Job queue handlers
      document.getElementById('btnRefreshJobs').addEventListener('click', async () => {
        refreshJobsStatus()
        refreshTimers()
      })

      // Kingdom scanner handlers
      document.getElementById('btnScanKingdom').addEventListener('click', async () => {
        const kingdoms = document.getElementById('kingdoms').value.trim()
        const priority = document.getElementById('priority').value
        if (!kingdoms) return log('Enter kingdoms')

        const res = await fetch(API + '/scanKingdom', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kingdoms, priority })
        })
        const data = await res.json()
        if (data.success) {
          log(`Queued ${data.jobIds?.length || 0} scan jobs`)
        } else {
          log('Error: ' + data.error)
        }
      })

      document.getElementById('btnTimerStart').addEventListener('click', async () => {
        const kingdoms = document.getElementById('kingdoms').value.trim()
        const interval = parseInt(document.getElementById('timerInterval').value) || 60000
        if (!kingdoms) return log('Enter kingdoms')

        const res = await fetch(API + '/timer/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kingdoms, interval })
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })

      document.getElementById('btnTimerStop').addEventListener('click', async () => {
        const kingdoms = document.getElementById('kingdoms').value.trim()
        if (!kingdoms) return log('Enter kingdoms')

        const res = await fetch(API + '/timer/stop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kingdoms })
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })

      // Merc scanner handlers
      document.getElementById('btnScanMercsNow').addEventListener('click', async () => {
        const level = parseInt(document.getElementById('mercLevel').value) || undefined
        const res = await fetch(API + '/scan-mercs-now', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ level })
        })
        const data = await res.json()
        if (data.success) {
          log(`Found ${data.found} mercs, notified: ${data.notified}`)
        } else {
          log('Error: ' + data.error)
        }
      })

      document.getElementById('btnMercTimerStart').addEventListener('click', async () => {
        const interval = parseInt(document.getElementById('timerInterval').value) || 60000
        const res = await fetch(API + '/timer/scan-mercs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ interval })
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })

      document.getElementById('btnMercTimerStop').addEventListener('click', async () => {
        const res = await fetch(API + '/timer/stop-mercs', { method: 'POST' })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })

      // Initial load
      refreshJobsStatus()
      refreshTimers()
      refreshStaticDb()
      checkBrowserStatus()
      if (document.getElementById('browserStatus').textContent === 'Running') {
        startAutoRefresh()
      }
    </script>
  </body>
</html>
