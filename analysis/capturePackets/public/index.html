<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayWTB - Job Queue System</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: 'Segolas', 'Consolas', monospace;
        margin: 0;
        padding: 20px;
        background: #1e1e1e;
        color: #d4d4d4;
      }
      .header {
        text-align: center;
        margin-bottom: 20px;
      }
      .header h1 {
        color: #569cd6;
        margin: 0;
        font-size: 24px;
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
        flex-wrap: wrap;
        align-items: center;
      }
      .tokens {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
        flex-wrap: wrap;
        align-items: center;
      }
      button {
        padding: 10px 20px;
        background: #0e639c;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #1177bb;
      }
      button:disabled {
        background: #444;
        cursor: not-allowed;
      }
      button.danger {
        background: #c00;
      }
      button.danger:hover {
        background: #e00;
      }
      button.active {
        background: #2e5e2e;
      }

      input,
      select {
        padding: 10px;
        background: #2d2d2d;
        color: #d4d4d4;
        border: 1px solid #444;
        border-radius: 4px;
        font-size: 14px;
      }

      label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      input[type='checkbox'] {
        width: 18px;
        height: 18px;
      }

      .panel {
        background: #252526;
        border-radius: 8px;
        margin-bottom: 15px;
        overflow: hidden;
      }
      .panel-header {
        font-weight: bold;
        padding: 10px 15px;
        background: #2d2d2d;
        border-bottom: 1px solid #3c3c3c;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .panel-header .count {
        color: #569cd6;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }
      @media (max-width: 1200px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .list {
        max-height: 250px;
        overflow-y: auto;
      }
      .list-item {
        padding: 8px 15px;
        border-bottom: 1px solid #3c3c3c;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
      }
      .list-item:hover {
        background: #2d2d2d;
      }

      .log {
        background: #1e1e1e;
        padding: 10px;
        max-height: 200px;
        overflow-y: auto;
        font-size: 12px;
        white-space: pre-wrap;
        font-family: 'Consolas', monospace;
      }

      .stat {
        display: flex;
        gap: 20px;
      }
      .stat-item {
        text-align: center;
      }
      .stat-value {
        font-size: 24px;
        color: #569cd6;
      }
      .stat-label {
        font-size: 11px;
        color: #888;
      }

      .section-title {
        font-size: 12px;
        color: #888;
        margin-bottom: 5px;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .row-wrap {
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <div class="header"><h1>PlayWTB - Job Queue System</h1></div>

    <!-- Browser Controls -->
    <div class="panel">
      <div class="panel-header">
        <div>
          Browser <span id="browserStatus" class="count">Stopped</span>
          <span id="gameStatus" class="count">Stopped</span>
        </div>
        <div class="tokens">
          <div>PlayerId: <span id="token1">none</span></div>
          <div>Session Token: <span id="token2">none</span></div>
        </div>
      </div>
      <div class="controls" style="padding: 15px">
        <button id="btnBrowserStart">Start Browser</button>
        <button id="btnBrowserStop" disabled class="danger">Stop Browser</button>
        <label>
          <input type="checkbox" id="cbCapturing" disabled />
          <span>Capture Packets for analysis</span>
        </label>
      </div>
    </div>

    <div class="panel">
      <div>
        <input
          type="text"
          style="width: 100px"
          id="defaultKingdom"
          onchange="saveValue(this.value, 'defaultKingdom')"
        />
        <button type="button" id="btnSetDefaultKingdom">Set default kingdom</button>
      </div>
      <div>
        <select id="gameChatChannelList">
          <option value="none" disabled>None</option>
        </select>
        <button type="button" id="btnSetChatChannel">Set Channel</button>
        <button id="btnRefreshChatChannels" style="padding: 5px 10px; font-size: 12px">
          Refresh
        </button>
      </div>
    </div>

    <!-- Job Queue Status -->
    <div class="panel">
      <div class="panel-header">
        Job Queue
        <button id="btnRefreshJobs" style="padding: 5px 10px; font-size: 12px">Refresh</button>
      </div>
      <div class="controls" style="padding: 15px">
        <div class="stat">
          <div class="stat-item">
            <div class="stat-value" id="statWaiting">0</div>
            <div class="stat-label">Waiting</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statActive">0</div>
            <div class="stat-label">Active</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statCompleted">0</div>
            <div class="stat-label">Completed</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statFailed">0</div>
            <div class="stat-label">Failed</div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div>Scanner for Kingdom <span id="kingdom"></span></div>
      </div>
      <div class="controls" style="padding: 15px">
        <button id="btnScanKingdom" disabled>Scan Now</button>
        <div style="margin-left: 32px">
          <span class="section-title">Interval (ms):</span>
          <input type="number" id="timerInterval" value="60000" style="width: 100px" />
        </div>
        <button id="btnTimerStart" disabled>Start Timer</button>
        <button id="btnTimerStop" class="danger" disabled>Stop Timer</button>
      </div>
    </div>

    <!-- Other kingdoms Scanner periodic job scheduler -->
    <div class="panel">
      <div class="panel-header">Other Kingdoms Scanner</div>
      <div class="controls" style="padding: 15px">
        <input
          type="text"
          id="otherKingdoms"
          onchange="saveValue(this.value, 'otherKingdoms')"
          placeholder="147,142,143"
          style="width: 250px"
        />

        <!-- <input type="number" id="mercLevel" placeholder="Min Level" style="width: 100px" /> -->
        <button id="btnScanOtherKingdomsNow">Scan Now</button>
        <div style="margin-left: 32px">
          <span class="section-title">Interval (ms):</span>
          <input type="number" id="timerIntervalOtherKingdoms" value="60000" style="width: 100px" />
        </div>
        <button id="btnScanOtherKingdomStart">Start Timer</button>
        <button id="btnScanOtherKingdomStop" class="danger">Stop Timer</button>
      </div>
    </div>

    <div class="panel">
      <div class="controls" style="padding: 15px">
        <input
          type="text"
          id="otherKingdoms2"
          onchange="saveValue(this.value, 'otherKingdoms2')"
          placeholder="147,142,143"
          style="width: 250px"
        />

        <!-- <input type="number" id="mercLevel" placeholder="Min Level" style="width: 100px" /> -->
        <button id="btnScanOtherKingdomsNow2">Scan Now</button>
        <div style="margin-left: 32px">
          <span class="section-title">Interval (ms):</span>
          <input
            type="number"
            id="timerIntervalOtherKingdoms2"
            value="60000"
            style="width: 100px"
          />
        </div>
        <button id="btnScanOtherKingdomStart2">Start Timer</button>
        <button id="btnScanOtherKingdomStop2" class="danger">Stop Timer</button>
      </div>
    </div>

    <div class="panel">
      <div class="controls" style="padding: 15px">
        <input
          type="text"
          id="otherKingdoms3"
          onchange="saveValue(this.value, 'otherKingdoms3')"
          placeholder="147,142,143"
          style="width: 250px"
        />

        <!-- <input type="number" id="mercLevel" placeholder="Min Level" style="width: 100px" /> -->
        <button id="btnScanOtherKingdomsNow3">Scan Now</button>
        <div style="margin-left: 32px">
          <span class="section-title">Interval (ms):</span>
          <input
            type="number"
            id="timerIntervalOtherKingdoms3"
            value="60000"
            style="width: 100px"
          />
        </div>
        <button id="btnScanOtherKingdomStart3">Start Timer</button>
        <button id="btnScanOtherKingdomStop3" class="danger">Stop Timer</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div>Find objects in K: <span id="kingdomObj"></span></div>
      </div>
      <div class="controls" style="padding: 15px">
        <label
          >Amount : <input type="number" id="objectAmount" value="10" style="width: 100px"
        /></label>
        <label
          >Object name :
          <input type="text" id="objectName" placeholder="cripta" style="width: 250px" /></label
        ><label
          >Amount : <input type="number" id="objectLevel" value="20" style="width: 100px"
        /></label>
        <button id="btnFindObjects">Search</button>
      </div>
    </div>

    <!-- Active Timers -->
    <div class="panel">
      <div class="panel-header">
        Active Timers
        <button id="btnRefreshTimers">Refresh</button>
        <button id="btnStopAllTimers">Stop All</button>
      </div>
      <div class="list" id="timersList">
        <div class="list-item">No active timers</div>
      </div>
    </div>

    <!-- Log -->
    <div class="panel">
      <div class="panel-header">Log</div>
      <div class="log" id="log"></div>
    </div>

    <script>
      const API = '/api'
      let refreshInterval = null
      let chatChannelLoaded = false
      // let staticDbPage = { offset: 0, limit: 50, count: 0 }

      function log(msg) {
        const el = document.getElementById('log')
        el.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`
        el.scrollTop = el.scrollHeight
      }

      async function refreshJobsStatus() {
        try {
          const res = await fetch(API + '/jobs/status')
          const data = await res.json()
          if (data.success) {
            document.getElementById('statWaiting').textContent = data.waiting
            document.getElementById('statActive').textContent = data.active
            document.getElementById('statCompleted').textContent = data.completed
            document.getElementById('statFailed').textContent = data.failed
          }
        } catch (e) {
          log('Jobs status error: ' + e.message)
        }
      }

      async function refreshTimers() {
        try {
          const res = await fetch(API + '/timers')
          const data = await res.json()

          if (data.success) {
            const el = document.getElementById('timersList')
            if (data.timers.length === 0) {
              el.innerHTML = '<div class="list-item">No active timers</div>'
            } else {
              el.innerHTML = data.timers
                .map(
                  t => `
                <div class="list-item">
                  <span>${t.key}</span> <span>${t.name}</span>
                  <span style="color:#aabb33">Next run: ${t.nextRunAt}</span>
                  <span style="color:#569cd6">${t.interval}</span>
                </div>
              `
                )
                .join('')
            }
          }
        } catch (e) {
          log('Timers error: ' + e.message)
        }
      }

      async function checkBrowserStatus() {
        try {
          const res = await fetch(API + '/browser/status')
          const data = await res.json()
          if (data.success) {
            const statusEl = document.getElementById('browserStatus')
            statusEl.textContent = data.running ? 'Running' : 'Stopped'
            statusEl.style.color = data.running ? '#4caf50' : '#888'

            document.getElementById('btnBrowserStart').disabled = data.running
            document.getElementById('btnBrowserStop').disabled = !data.running
            document.getElementById('cbCapturing').disabled = !data.running
            document.getElementById('cbCapturing').checked = data.capturing

            const kingdomEl = document.getElementById('kingdom')
            const kingdomEl2 = document.getElementById('kingdomObj')
            kingdomEl.textContent = data.kingdom
            kingdomEl2.textContent = data.kingdom
            document.getElementById('btnScanKingdom').disabled = data?.kingdom.trim() == ''
            document.getElementById('btnTimerStart').disabled = data?.kingdom.trim() == ''
            document.getElementById('btnTimerStop').disabled = data?.kingdom.trim() == ''

            const token1El = document.getElementById('token1')
            const token2El = document.getElementById('token2')

            token1El.textContent = data.token1 ? 'ready' : 'none'
            token2El.textContent = data.token2 ? 'ready' : 'none'
            token1El.style.color = data.token1 ? '#4caf50' : '#888'
            token2El.style.color = data.token2 ? '#4caf50' : '#888'

            if (data.activeChatChannel && !chatChannelLoaded) {
              const gameChatChannelList = document.getElementById('gameChatChannelList')
              gameChatChannelList.innerHTML = ''

              const opcion = document.createElement('option')
              opcion.value = data.activeChatChannel
              opcion.text = data.activeChatChannel
              opcion.selected = true

              gameChatChannelList.appendChild(opcion)
            }

            if (data.gameLoaded) {
              const gameStatusEl = document.getElementById('gameStatus')
              gameStatusEl.textContent = data.gameLoaded ? 'Playing' : 'Stopped'
              if (!chatChannelLoaded) {
                chatChannelLoaded = true
                getGameChatChannels()
              }
            }
          }
        } catch (e) {
          log('Browser status error: ' + e.message)
        }
      }

      function startAutoRefresh() {
        refreshInterval = setInterval(() => {
          checkBrowserStatus()
          refreshJobsStatus()
          refreshTimers()
        }, 5000)
      }

      function stopAutoRefresh() {
        if (refreshInterval) {
          clearInterval(refreshInterval)
          refreshInterval = null
        }
      }

      async function getGameChatChannels() {
        try {
          const res = await fetch(API + '/gameChatChannels')
          const data = await res.json()
          if (data.success) {
            const gameChatChannelList = document.getElementById('gameChatChannelList')

            log('got chat channels ' + data.channels.length)
            if (Array.isArray(data.channels) && data.channels.length > 0) {
              gameChatChannelList.innerHTML = ''

              data.channels.forEach((channel, index) => {
                const opcion = document.createElement('option')

                opcion.value = channel._url
                opcion.text = channel._name

                if (data.activeChatChannel === channel._url) {
                  opcion.selected = true
                }

                gameChatChannelList.appendChild(opcion)
              })
            }
          }
        } catch (e) {
          log('Browser status error: ' + e.message)
        }
      }

      // Browser handlers
      document.getElementById('btnFindObjects').addEventListener('click', async () => {
        const name = document.getElementById('objectName').value.trim()
        const level = parseInt(document.getElementById('objectLevel').value) || 0
        const amount = parseInt(document.getElementById('objectAmount').value) || 0

        log(`Searching for objects: ${objectAmount} ${objectName} lvl: ${objectLevel}`)
        const res = await fetch(API + '/api/objects/find-and-notify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, level, amount })
        })
        const data = await res.json()
        if (data.success) {
          log('result: ')
        } else {
          log('Error: ' + data.error)
        }
      })

      document.getElementById('btnBrowserStart').addEventListener('click', async () => {
        log('Starting browser...')
        const res = await fetch(API + '/browser/start', { method: 'POST' })
        const data = await res.json()
        if (data.success) {
          log('Browser started!')
          startAutoRefresh()
        } else {
          log('Error: ' + data.error)
        }
      })

      document.getElementById('btnBrowserStop').addEventListener('click', async () => {
        await fetch(API + '/browser/stop', { method: 'POST' })
        log('Browser stopped')
        stopAutoRefresh()
      })

      document.getElementById('cbCapturing').addEventListener('change', async e => {
        const endpoint = e.target.checked ? '/capturing/start' : '/capturing/stop'
        await fetch(API + endpoint, { method: 'POST' })
        log(e.target.checked ? 'Capturing started' : 'Capturing stopped')
      })

      //set chat channel
      document.getElementById('btnSetChatChannel').addEventListener('click', async () => {
        const gameChatChannelList = document.getElementById('gameChatChannelList')
        console.log('front chat channel selected', gameChatChannelList.value)
        const res = await fetch(API + '/gameChatChannels', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ channel: gameChatChannelList.value })
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })

      //set default kingom
      function saveValue(val, key) {
        localStorage.setItem(key, val)
      }

      window.onload = function () {
        const defaultKingdom = localStorage.getItem('defaultKingdom')
        if (defaultKingdom) {
          document.getElementById('defaultKingdom').value = defaultKingdom
        }

        const otherKingdoms = localStorage.getItem('otherKingdoms')
        if (otherKingdoms) {
          document.getElementById('otherKingdoms').value = otherKingdoms
        }

        const otherKingdoms2 = localStorage.getItem('otherKingdoms2')
        if (otherKingdoms2) {
          document.getElementById('otherKingdoms2').value = otherKingdoms2
        }

        const otherKingdoms3 = localStorage.getItem('otherKingdoms3')
        if (otherKingdoms3) {
          document.getElementById('otherKingdoms3').value = otherKingdoms3
        }
      }
      // document.getElementById('defaultKingdom').addEventListener('change',()=>{
      // })
      document.getElementById('btnSetDefaultKingdom').addEventListener('click', async () => {
        const kingdom = document.getElementById('defaultKingdom').value
        console.log('front kingdom val', kingdom)
        const res = await fetch(API + '/kingdom', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kingdom })
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })

      document.getElementById('gameChatChannelList').addEventListener('change', async e => {
        console.log('Selected Value:', e.target.value)
        console.log('Selected Text:', e.target.options[e.target.selectedIndex].text)
      })

      // chat channels
      document.getElementById('btnRefreshChatChannels').addEventListener('click', async () => {
        getGameChatChannels()
      })

      // Job queue handlers
      document.getElementById('btnRefreshJobs').addEventListener('click', async () => {
        refreshJobsStatus()
        refreshTimers()
      })

      // Kingdom scanner handlers
      document.getElementById('btnScanKingdom').addEventListener('click', async () => {
        // const kingdoms = document.getElementById('kingdoms').value.trim()

        const res = await fetch(API + '/scanKingdom', {
          method: 'POST'
          // headers: { 'Content-Type': 'application/json' },
          // body: JSON.stringify({ kingdoms })
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })

      document.getElementById('btnTimerStart').addEventListener('click', async () => {
        // const kingdoms = document.getElementById('kingdoms').value.trim()
        const interval = parseInt(document.getElementById('timerInterval').value) || 60000
        // if (!kingdoms) return log('Enter kingdoms')

        const res = await fetch(API + '/timer/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ interval })
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })

      document.getElementById('btnTimerStop').addEventListener('click', async () => {
        // const kingdoms = document.getElementById('kingdoms').value.trim()
        // if (!kingdoms) return log('Enter kingdoms')

        const res = await fetch(API + '/timer/stop', {
          method: 'POST'
          // headers: { 'Content-Type': 'application/json' },
          // body: JSON.stringify({ kingdoms })
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })

      // Other kingdoms scanner handlers
      document.getElementById('btnScanOtherKingdomsNow').addEventListener('click', async () => {
        const otherKingdoms = document.getElementById('otherKingdoms').value
        const res = await fetch(API + '/scan-other-kingdoms-now', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kingdoms: otherKingdoms })
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })

      document.getElementById('btnScanOtherKingdomStart').addEventListener('click', async () => {
        const otherKingdoms = document.getElementById('otherKingdoms').value
        const interval =
          parseInt(document.getElementById('timerIntervalOtherKingdoms').value) || 60000
        const res = await fetch(API + '/timer/scan-other-kingdoms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ interval, kingdoms: otherKingdoms, key: '1' })
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })
      document.getElementById('btnScanOtherKingdomStop').addEventListener('click', async () => {
        const res = await fetch(API + '/timer/stop-scan-other-kingdoms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: '1' })
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })

      //ScanOtherKingdom 2
      document.getElementById('btnScanOtherKingdomsNow2').addEventListener('click', async () => {
        const otherKingdoms = document.getElementById('otherKingdoms2').value
        const res = await fetch(API + '/scan-other-kingdoms-now', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kingdoms: otherKingdoms })
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })

      document.getElementById('btnScanOtherKingdomStart2').addEventListener('click', async () => {
        const otherKingdoms = document.getElementById('otherKingdoms2').value
        const interval =
          parseInt(document.getElementById('timerIntervalOtherKingdoms2').value) || 60000
        const res = await fetch(API + '/timer/scan-other-kingdoms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ interval, kingdoms: otherKingdoms, key: '2' })
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })

      document.getElementById('btnScanOtherKingdomStop2').addEventListener('click', async () => {
        const res = await fetch(API + '/timer/stop-scan-other-kingdoms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: '2' })
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })

      //ScanOtherKingdom 3
      document.getElementById('btnScanOtherKingdomsNow3').addEventListener('click', async () => {
        const otherKingdoms = document.getElementById('otherKingdoms3').value
        const res = await fetch(API + '/scan-other-kingdoms-now', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kingdoms: otherKingdoms })
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })
      document.getElementById('btnScanOtherKingdomStart3').addEventListener('click', async () => {
        const otherKingdoms = document.getElementById('otherKingdoms3').value
        const interval =
          parseInt(document.getElementById('timerIntervalOtherKingdoms3').value) || 60000
        const res = await fetch(API + '/timer/scan-other-kingdoms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ interval, kingdoms: otherKingdoms, key: '3' })
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })
      document.getElementById('btnScanOtherKingdomStop3').addEventListener('click', async () => {
        const res = await fetch(API + '/timer/stop-scan-other-kingdoms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: '3' })
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
        } else {
          log('Error: ' + data.error)
        }
      })

      //btnStopAllTimers
      document.getElementById('btnStopAllTimers').addEventListener('click', async () => {
        const res = await fetch(API + '/timer/stop-all', {
          method: 'POST'
        })
        const data = await res.json()
        if (data.success) {
          log(data.message)
          refreshTimers()
        } else {
          log('Error: ' + data.error)
        }
      })

      //btnRefreshTimers
      document.getElementById('btnRefreshTimers').addEventListener('click', async () => {
        refreshTimers()
      })

      // Initial load
      refreshJobsStatus()
      refreshTimers()
      checkBrowserStatus()
      if (document.getElementById('browserStatus').textContent === 'Running') {
        startAutoRefresh()
      }
    </script>
  </body>
</html>
