services:
  app:
    build:
      context: ..
      dockerfile: capturePackets/Dockerfile
    container_name: playwtb-app
    ports:
      - "3000:3000"
    ipc: host
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 2G
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HEADLESS=true
      - CHAT_CHANNEL_URL=${CHAT_CHANNEL_URL:-}
      - CHAT_ACCOUNT_USER=${CHAT_ACCOUNT_USER:-}
      - CHAT_ACCOUNT_PWD=${CHAT_ACCOUNT_PWD:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - DISCORD_CHANNELID=${DISCORD_CHANNELID:-}
    volumes:
      - ./public:/app/captures
      - ./staticId-db.json:/app/staticId-db.json
      - ./myplayer.json:/app/myplayer.json
      - ./.env:/app/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - playwtb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    # Cambiamos a redis-stack-server para tener RediSearch
    image: redis/redis-stack-server:latest
    container_name: playwtb-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_ARGS=--appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - playwtb-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  playwtb-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
