<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=620, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>TB Object Scanner</title>
    <style>
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e1e1e;
      }
      ::-webkit-scrollbar-thumb {
        background: #3c3c3c;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4f4f4f;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        width: 620px !important;
        height: 600px !important;
        padding: 0;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: Consolas, monospace;
        background: #1e1e1e;
        color: #d4d4d4;
        font-size: 13px;
        width: 620px !important; /* Forzar el mismo ancho que el html */
        height: 600px !important;
        overflow: hidden;
        padding-bottom: 0;
      }
      .header {
        background: #2d2d2d;
        padding: 8px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #3c3c3c;
      }
      .header h2 {
        color: #569cd6;
        font-size: 14px;
      }
      .header .close-btn {
        background: #c00;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 2px 8px;
        cursor: pointer;
        font-size: 16px;
      }

      .slider-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 12px 0;
      }
      .slider-row label {
        font-size: 11px;
        color: #888;
        min-width: 40px;
      }
      .slider-row input[type='range'] {
        flex: 1;
        height: 4px;
        accent-color: #569cd6;
      }
      .slider-row .val {
        font-size: 11px;
        color: #569cd6;
        min-width: 24px;
        text-align: center;
      }
      .server-row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .server-row input {
        flex: 1;
        padding: 4px 8px;
        background: #2d2d2d;
        border: 1px solid #444;
        border-radius: 4px;
        color: #d4d4d4;
        font-size: 11px;
        font-family: Consolas, monospace;
      }
      .btn {
        padding: 4px 12px;
        background: #0e639c;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
        font-family: Consolas, monospace;
      }
      .btn:hover {
        background: #1177bb;
      }
      .btn:disabled {
        background: #444;
        cursor: not-allowed;
      }
      .list-container {
        display: flex;
        flex: 1;
        overflow-y: auto;
      }
      .list-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 12px;
        border-bottom: 1px solid #3c3c3c;
      }
      .list-item:hover {
        background: #2d2d2d;
      }
      .list-item .info {
        flex: 1;
      }
      .list-item .name {
        color: #d4d4d4;
        font-size: 13px;
      }
      .list-item .meta {
        color: #888;
        font-size: 11px;
      }
      .list-item .meta span {
        margin-right: 8px;
      }
      .list-item .go-btn {
        padding: 3px 10px;
        background: #2e5e2e;
        color: white;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        font-size: 11px;
      }
      .list-item .go-btn:hover {
        background: #3a7a3a;
      }
      .empty-msg {
        text-align: center;
        color: #888;
        padding: 40px 20px;
      }
      .status-bar {
        background: #2d2d2d;
        padding: 6px 12px;
        border-top: 1px solid #3c3c3c;
        font-size: 11px;
        color: #888;
        display: flex;
        justify-content: space-between;
      }
      #filtersContainer,
      #listContainer {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>TB Object Scanner</h2>
      <button class="close-btn" id="closeBtn">X</button>
    </div>

    <div class="filters" id="filtersContainer"></div>
    <div class="list-container" id="listContainer">
      <div class="empty-msg">Click Search to find objects</div>
    </div>
    <div class="status-bar">
      <span id="statusText">Ready</span>
      <span id="countText">0 objects</span>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
